function usarDados(de, ate, prevDe) {
    const [estado, setEstado] = useState({ carregando: true, erro: null });
    const [fato, setFato] = useState([]);
    const [motivos, setMotivos] = useState([]);
    const [sla, setSla] = useState([]);
    const [esforco, setEsforco] = useState([]);
    const [tempoAntigo, setTempoAntigo] = useState(false);
    const [pendentes, setPendentes] = useState([]);
    const [carteiraEsf, setCarteiraEsf] = useState([]);
    const [robo, setRobo] = useState([]);
    const [qualidade, setQualidade] = useState(null);
    const [funilAgora, setFunilAgora] = useState([]);
    const [metas, setMetas] = useState({ sdr: [], taxa: null });
    /* O Supabase corta em 1.000 linhas por consulta. A fato_dia tem uma linha
       por dia × SDR × unidade × serviço, então um mês passa desse teto e os
       totais sairiam menores sem ninguém perceber. Buscamos em páginas até
       acabar. */
    const PAGINA = 1000;
    const buscarTudo = async (montar) => {
        const todas = [];
        for (let i = 0; i < 40; i++) {
            const { data, error } = await montar().range(i * PAGINA, (i + 1) * PAGINA - 1);
            if (error)
                throw new Error(error.message);
            const lote = data || [];
            todas.push(...lote);
            if (lote.length < PAGINA)
                break;
        }
        return todas;
    };
    const buscar = useCallback(async () => {
        setEstado({ carregando: true, erro: null });
        try {
            const [f, m] = await Promise.all([
                buscarTudo(() => db.from("fato_dia").select("*").gte("data", prevDe).lte("data", ate).order("data")),
                buscarTudo(() => db.from("motivos_dia").select("*").gte("data", de).lte("data", ate).order("data")),
            ]);
            setFato(f);
            setMotivos(m);
            /* Tolerante de propósito: uma view que ainda não foi criada no banco
               não pode derrubar o painel inteiro. Some o bloco, fica o resto. */
            const buscarSePuder = async (montar) => {
                try {
                    return await buscarTudo(montar);
                }
                catch (e) {
                    return null;
                }
            };
            /* tempo_resposta_dia é a view nova, medida pela primeira ligação de
               verdade. sla_dia é a antiga, com nomes velhos e medida pela saída
               da etapa de entrada — fica como plano B para o painel não quebrar
               entre um deploy do banco e outro. */
            let s = await buscarSePuder(() => db.from("tempo_resposta_dia")
                .select("*").gte("data", de).lte("data", ate).order("data"));
            let antiga = false;
            if (s === null) {
                antiga = true;
                const v = await buscarSePuder(() => db.from("sla_dia")
                    .select("*").gte("data", de).lte("data", ate).order("data")) || [];
                s = v.map((r) => ({ ...r, ate_5min: r.sla_5, ate_15min: r.sla_15,
                    ate_60min: r.sla_60, acima_de_1h: r.sla_acima, nunca_ligaram: 0 }));
            }
            setSla(s);
            setTempoAntigo(antiga);
            const es = await buscarSePuder(() => db.from("esforco_dia")
                .select("*").gte("data", de).lte("data", ate).order("data"));
            setEsforco(es || []);
            const vp = await buscarSePuder(() => db.from("visitas_pendentes_dia")
                .select("*").gte("data", de).lte("data", ate).order("data"));
            setPendentes(vp || []);
            /* O espelho do esforço na chave da carteira, e a cobertura do robô.
               Os dois são opcionais: sem eles o painel só mostra menos coluna. */
            const ce = await buscarSePuder(() => db.from("carteira_esforco_dia")
                .select("*").gte("data", de).lte("data", ate).order("data"));
            setCarteiraEsf(ce || []);
            const rb = await buscarSePuder(() => db.from("robo_dia")
                .select("*").gte("data", de).lte("data", ate).order("data"));
            setRobo(rb || []);
            /* Estas quatro são acessórias: se uma falhar, o painel continua com o
               que importa em vez de zerar tudo. */
            const opcional = async (fn, padrao) => {
                try {
                    const { data, error } = await fn();
                    return error ? padrao : (data ?? padrao);
                }
                catch (e) {
                    return padrao;
                }
            };

                opcional(() => db.from("qualidade").select("*").limit(1), []),
                opcional(() => db.from("funil_agora").select("*"), []),
                opcional(() => db.from("metas_sdr").select("*"), []),
                opcional(() => db.from("metas_taxa").select("*").limit(1), []),
            ]);
            setQualidade(q[0] || null);
            setFunilAgora(fa);
            setMetas({ sdr: ms, taxa: mt[0] || null });
            setEstado({ carregando: false, erro: null, em: new Date() });
        }
        catch (e) {
            setEstado({ carregando: false, erro: e.message || String(e) });
        }

    useEffect(() => { buscar(); }, [buscar]);
    /* O painel fica ligado numa TV: ninguém vai apertar "Atualizar". A cada
       5 minutos ele busca sozinho. Como o filtro "Hoje" recalcula a data a
       cada render, a virada da meia-noite se resolve na atualização
       seguinte — não é preciso recarregar a página. */

        const t = setInterval(() => { buscar(); }, 5 * 60 * 1000);
        return () => clearInterval(t);

        carteiraEsf, robo, qualidade, funilAgora, metas, recarregar: buscar };

(function () {
  var VERSAO = "v10";
  console.log("Painel SDR " + VERSAO);
  var raiz = document.getElementById("root");

  function parar(titulo, detalhe) {
    raiz.innerHTML =
      '<div style="max-width:560px;margin:64px auto;padding:24px;background:#fff;' +
      'border:1px solid #E4E7EB;border-radius:8px;line-height:1.6">' +

      '<div style="font-size:11px;color:#9AA5B4;margin-bottom:10px">Painel SDR ' + VERSAO + '</div>' +
      '<div style="font-size:13.5px;color:#3D454F">' + detalhe + '</div></div>';
  }

  if (!window.React || !window.ReactDOM) {
    return parar("O painel não carregou",
      "Não foi possível baixar o <b>React</b>. Normalmente é bloqueio de CDN na rede. " +
      "Tente recarregar, ou abra fora da rede corporativa.");
  }
  if (!window.supabase) {
    return parar("O painel não carregou",
      "Não foi possível baixar o <b>cliente do Supabase</b>. Tente recarregar, " +
      "ou abra fora da rede corporativa.");
  }
  if (!CONFIG.anonKey || CONFIG.anonKey.indexOf("COLE_AQUI") === 0) {
    return parar("Falta configurar a chave",
      "Abra o <code>index.html</code>, procure por <code>anonKey</code> e cole a chave " +
      "<b>anon public</b> do projeto — em Supabase → Project Settings → API.");
  }

  /* Rede de segurança final: se em 20 segundos nada tiver sido desenhado,
     mostra o diagnóstico em vez de deixar a pessoa olhando "Carregando".
     A tela vira a informação de que eu preciso para consertar. */
  var vigia = setTimeout(function () {
    if (window.__painelDesenhou) return;
    parar("O painel travou ao carregar",
      "Nada foi desenhado em 20 segundos. Diagnóstico: " +
      "React " + (window.React ? "ok" : "FALTOU") + " · " +
      "Supabase " + (window.supabase ? "ok" : "FALTOU") +
      ". Tente Ctrl+Shift+R. Se persistir, mande um print desta tela.");
  }, 20000);

    iniciarPainel();
